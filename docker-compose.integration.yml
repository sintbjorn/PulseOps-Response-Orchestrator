services:
  pulseops-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulseops
      POSTGRES_USER: pulseops
      POSTGRES_PASSWORD: pulseops
    volumes:
      - pulseops_integration_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseops -d pulseops"]
      interval: 5s
      timeout: 5s
      retries: 20

  pulseops:
    build: .
    environment:
      PULSEOPS_ENVIRONMENT: integration
      PULSEOPS_DATABASE_URL: postgresql+psycopg://pulseops:pulseops@pulseops-db:5432/pulseops
      PULSEOPS_AUTO_CREATE_SCHEMA: "1"
      PULSEOPS_SEED_DEMO_DATA: "1"
      PULSEOPS_PULSEWATCH_BASE_URL: http://pulsewatch:8000
      PULSEOPS_PULSEWATCH_CALLBACK_ENABLED: "0"
      PULSEOPS_NOTIFICATION_CALLBACK_ENABLED: "0"
      PULSEOPS_HTTP_TIMEOUT_SECONDS: "5"
    depends_on:
      pulseops-db:
        condition: service_healthy
    ports:
      - "8010:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  pulsewatch-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pulsewatch_integration_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d incidents"]
      interval: 5s
      timeout: 5s
      retries: 20

  pulsewatch:
    build: ./integrations/PulseWatch_Incident_Service
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@pulsewatch-db:5432/incidents
      RESPONSE_ORCHESTRATOR_URL: http://pulseops:8000
      RESPONSE_ORCHESTRATOR_TIMEOUT_SECONDS: "5"
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      NOTIFICATION_SERVICE_API_KEY: dev-notification-api-key
      NOTIFICATION_USER_ID: "1"
      NOTIFICATION_CHANNEL: email
      NOTIFICATION_TIMEOUT_SECONDS: "5"
    depends_on:
      pulsewatch-db:
        condition: service_healthy
      pulseops:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "8011:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notif
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: notif
    volumes:
      - notification_integration_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif -d notif"]
      interval: 5s
      timeout: 5s
      retries: 20

  notification-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - notification_integration_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  notification-service:
    build: ./integrations/notification_service
    environment: &notification_env
      DJANGO_SETTINGS_MODULE: notifier.settings.local
      DJANGO_SECRET_KEY: integration-secret-key
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,notification-service
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8020,http://127.0.0.1:8020
      DATABASE_URL: postgres://notif:notif@notification-db:5432/notif
      REDIS_URL: redis://notification-redis:6379/0
      NOTIFICATION_API_KEY: dev-notification-api-key
      METRICS_API_KEY: dev-notification-api-key
      ENABLE_GRAPHIQL: "1"
      SMTP_HOST: notification-mailpit
      SMTP_PORT: "1025"
      SMTP_SENDER: no-reply@example.com
      TELEGRAM_BOT_TOKEN: fake-token
      TELEGRAM_WEBHOOK_SECRET: integration-telegram-secret
      TWILIO_SID: sid
      TWILIO_TOKEN: token
      TWILIO_FROM: "+10000000000"
      LOG_LEVEL: INFO
    command:
      [
        "sh",
        "-c",
        "python manage.py migrate --noinput && python manage.py seed_demo --email pulseops-demo@example.com --channel-priority email --idempotency-key integration-seed && gunicorn notifier.wsgi:application -b 0.0.0.0:8000 --workers 2",
      ]
    depends_on:
      notification-db:
        condition: service_healthy
      notification-redis:
        condition: service_healthy
      notification-mailpit:
        condition: service_started
    ports:
      - "8020:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  notification-worker:
    build: ./integrations/notification_service
    environment: *notification_env
    command: celery -A notifier worker -l info
    depends_on:
      notification-service:
        condition: service_healthy
      notification-redis:
        condition: service_healthy

  notification-beat:
    build: ./integrations/notification_service
    environment: *notification_env
    command: celery -A notifier beat -l info
    depends_on:
      notification-service:
        condition: service_healthy
      notification-redis:
        condition: service_healthy

  notification-mailpit:
    image: axllent/mailpit:v1.29.7
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pulseops_integration_db:
  pulsewatch_integration_db:
  notification_integration_db:
  notification_integration_redis:
